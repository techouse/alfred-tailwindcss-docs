name: Release package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: read-all

jobs:
  build:
    name: Build universal workflow
    uses: ./.github/workflows/build.yml
    secrets: inherit

  github-release:
    name: GitHub release
    needs: build
    environment: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read and verify release version
        id: version
        run: |
          set -euo pipefail
          ./scripts/version-check.sh "$GITHUB_REF_NAME"
          VERSION=$(awk '/^\[package\]$/ { p = 1; next } p && /^\[/ { exit } p && /^version = / { gsub(/["[:space:]]/, "", $3); print $3; exit }' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download universal workflow
        uses: actions/download-artifact@v8
        with:
          name: ${{ vars.WORKFLOW_NAME }}-v${{ steps.version.outputs.version }}-universal
          path: ${{ runner.temp }}/download

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/download/${{ vars.WORKFLOW_NAME }}-v${{ steps.version.outputs.version }}.alfredworkflow

      - name: Clean up downloaded artifact
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/download"
